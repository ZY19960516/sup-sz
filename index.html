<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <title>深圳浆板风浪</title>
  <meta name="description" content="深圳浆板点位实时风浪预警">

  <!-- PWA -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0ea5e9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="深圳浆板">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">

  <!-- 图表库 uPlot（本地，避免 CDN 问题） -->
  <link rel="stylesheet" href="./lib/uPlot.min.css">
  <script src="./lib/uPlot.iife.min.js"></script></script>

  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <header>
    <div>
      <h1>🏄 深圳浆板风浪</h1>
      <div class="header-sub" id="header-sub">正在加载…</div>
    </div>
    <button class="refresh-btn" id="refresh">↻ 刷新</button>
  </header>

  <div class="banner" id="banner"></div>

  <div class="date-tabs" id="date-tabs">
    <button data-day="0" class="active">今天</button>
    <button data-day="1">明天</button>
    <button data-day="2">后天</button>
  </div>

  <div class="cards" id="cards"></div>

  <footer>
    <a class="official-link" href="https://pnr.sz.gov.cn/ywzy/hyyb/index.html" target="_blank" rel="noopener">
      📄 查看深圳官方海洋预报 →
    </a>
    <div class="footer-note">
      数据来源：Open-Meteo 多模式海浪 / 和风天气预警<br>
      浪高为数值模式预报（非实测），出行前请结合现场判断
    </div>
  </footer>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
